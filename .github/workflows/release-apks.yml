name: Release Android APKs

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-apks-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build, sign, and upload APKs
    runs-on: ubuntu-latest
    env:
      TOUCH_FIREBASE_PROJECT_ID: ${{ vars.TOUCH_FIREBASE_PROJECT_ID }}
      TOUCH_FIREBASE_SENDER_ID: ${{ vars.TOUCH_FIREBASE_SENDER_ID }}
      TOUCH_FIREBASE_API_KEY: ${{ vars.TOUCH_FIREBASE_API_KEY }}
      TOUCH_FIREBASE_APP_ID: ${{ vars.TOUCH_FIREBASE_APP_ID }}

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TOUCH_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TOUCH_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TOUCH_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in TOUCH_FIREBASE_PROJECT_ID TOUCH_FIREBASE_SENDER_ID \
            TOUCH_FIREBASE_API_KEY TOUCH_FIREBASE_APP_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions variable $name is not configured."
              missing=1
            fi
          done
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "::error::Required secret ANDROID_KEYSTORE_BASE64 is not configured."; missing=1; }
          [[ -n "$TOUCH_SIGNING_STORE_PASSWORD" ]] || { echo "::error::Required secret ANDROID_KEYSTORE_PASSWORD is not configured."; missing=1; }
          [[ -n "$TOUCH_SIGNING_KEY_ALIAS" ]] || { echo "::error::Required secret ANDROID_KEY_ALIAS is not configured."; missing=1; }
          [[ -n "$TOUCH_SIGNING_KEY_PASSWORD" ]] || { echo "::error::Required secret ANDROID_KEY_PASSWORD is not configured."; missing=1; }
          if (( missing )); then
            exit 1
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/touch-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "TOUCH_SIGNING_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build and sign release APKs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TOUCH_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TOUCH_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TOUCH_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version_name="${RELEASE_TAG#v}"
          ./gradlew --no-daemon test \
            :mobile:assembleRelease :wear:assembleRelease \
            :mobile:bundleRelease :wear:bundleRelease \
            -PTOUCH_VERSION_NAME="$version_name" \
            -PTOUCH_VERSION_CODE="${{ github.run_number }}"

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          [[ -n "$apksigner" ]] || { echo "::error::apksigner was not found."; exit 1; }
          "$apksigner" verify --verbose mobile/build/outputs/apk/release/mobile-release.apk
          "$apksigner" verify --verbose wear/build/outputs/apk/release/wear-release.apk
          jarsigner -verify mobile/build/outputs/bundle/release/mobile-release.aab
          jarsigner -verify wear/build/outputs/bundle/release/wear-release.aab

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          safe_tag="${RELEASE_TAG//\//-}"
          mkdir -p release-assets
          cp mobile/build/outputs/apk/release/mobile-release.apk \
            "release-assets/touch-mobile-$safe_tag.apk"
          cp wear/build/outputs/apk/release/wear-release.apk \
            "release-assets/touch-wear-$safe_tag.apk"
          cp mobile/build/outputs/bundle/release/mobile-release.aab \
            "release-assets/touch-mobile-$safe_tag.aab"
          cp wear/build/outputs/bundle/release/wear-release.aab \
            "release-assets/touch-wear-$safe_tag.aab"
          (cd release-assets && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)

      - name: Upload APKs to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
